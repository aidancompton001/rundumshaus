name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      # npm install поверх кеша периодически пропускает optional-зависимости
      # (баг npm #4828) — сборка падала на @rolldown/binding-linux-x64-gnu уже
      # после того, как правка клиента через админку была принята. Клиенту
      # приходило письмо об ошибке, хотя он ничего не сломал.
      # npm ci ставит строго по локу; следом проверка, что нативный модуль
      # действительно на месте, и доустановка, если его всё же нет.
      - name: Install dependencies
        run: npm ci

      - name: Ensure native build binding
        run: |
          node -e "require('@rolldown/binding-linux-x64-gnu')" 2>/dev/null             || npm install --no-save @rolldown/binding-linux-x64-gnu
          node -e "require('@rolldown/binding-linux-x64-gnu');console.log('нативный модуль на месте')"

      - name: Validate JSON data
        run: node -e "const fs=require('fs'),p=require('path'),d='src/data';fs.readdirSync(d).filter(f=>f.endsWith('.json')).forEach(f=>{try{JSON.parse(fs.readFileSync(p.join(d,f),'utf8'));console.log('✓',f)}catch(e){console.error('✗',f,e.message);process.exit(1)}})"

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
