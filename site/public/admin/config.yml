# PX-068 — Sveltia CMS Konfiguration (Admin Panel für Kevin)
#
# WICHTIG (Design Review G1 — anti-field-drop):
# Jede Collection deklariert ALLE Felder der Ziel-JSON-Datei, auch die,
# die Kevin nicht ändern soll (als readonly/hidden markiert). So kann ein
# Save niemals Felder verwerfen. Geprüft durch scripts/admin/validate-cms-config.mjs.

backend:
  name: github
  repo: aidancompton001/rundumshaus
  branch: master

site_url: https://rundumshaus-littawe.de
display_url: https://rundumshaus-littawe.de

media_folder: site/public/images/uploads
public_folder: /images/uploads

collections:
  # ────────────────────────────────────────────────────────────
  - name: startseite
    label: Startseite
    description: Texte und Bilder der Startseite. Änderungen sind nach dem Speichern in ca. 3–10 Minuten online.
    files:
      - name: homepage
        label: Startseite — Inhalte
        file: site/src/data/homepage.json
        fields:
          - name: hero
            label: Hero (oberer Bereich)
            widget: object
            fields:
              - { name: heading, label: Überschrift (H1), widget: string }
              - { name: subheading, label: Untertitel, widget: text }
              - name: ctas
                label: Buttons
                widget: list
                allow_add: false
                fields:
                  - { name: label, label: Button-Text, widget: string }
                  - { name: href, label: Ziel-Link, widget: string, hint: "Nur ändern, wenn du sicher bist (z. B. /kontakt)" }
                  - { name: variant, label: Stil, widget: select, options: [primary, ghost] }
          - name: about
            label: Über uns
            widget: object
            fields:
              - { name: heading, label: Überschrift, widget: string }
              - { name: body, label: Text — Absatz 1, widget: text }
              - { name: body2, label: Text — Absatz 2, widget: text, required: false }
              - { name: image, label: Bild, widget: image }
              - { name: imageAlt, label: Bild-Beschreibung (Alt-Text), widget: string }
          - name: stats
            label: Zahlen-Statistiken
            widget: list
            allow_add: false
            fields:
              - { name: value, label: Zahl, widget: number, value_type: int }
              - { name: suffix, label: Zusatz (z. B. % oder +), widget: string }
              - { name: label, label: Beschriftung, widget: string }
          - name: warumWir
            label: "Warum wir? (Bereich)"
            widget: object
            fields:
              - { name: heading, label: Überschrift, widget: string }
              - { name: subheading, label: Untertitel, widget: text }
              - { name: items, label: "Punkte (Häkchen)", widget: list, field: { name: item, label: Punkt, widget: string } }
          - name: faq
            label: "Häufige Fragen (Startseite)"
            widget: object
            fields:
              - { name: heading, label: Überschrift, widget: string }
              - name: items
                label: Fragen
                widget: list
                fields:
                  - { name: q, label: Frage, widget: string }
                  - { name: a, label: Antwort, widget: text }
          - name: einsatzgebiet
            label: "Einsatzgebiet (Startseite)"
            widget: object
            fields:
              - { name: heading, label: Überschrift, widget: string }
              - { name: text1, label: "Text — Städte-Liste", widget: text }
              - { name: text2, label: "Text — Hinweis", widget: text }
              - { name: ctaLabel, label: Button-Text, widget: string }
              - { name: slogan, label: "Schluss-Slogan", widget: text }
          - name: kontaktCta
            label: "Kontakt-Bereich (unten)"
            widget: object
            fields:
              - { name: heading, label: Überschrift, widget: string }
              - { name: text, label: Text, widget: text }

  # ────────────────────────────────────────────────────────────
  - name: leistungen
    label: Dienstleistungen
    description: Die 5 Hauptdienstleistungs-Karten (Titel, Beschreibungen, Bilder).
    files:
      - name: services
        label: Dienstleistungs-Karten
        file: site/src/data/services.json
        fields:
          - { name: heading, label: Bereichs-Überschrift, widget: string }
          - { name: subheading, label: Bereichs-Untertitel, widget: text }
          - name: services
            label: Karten
            widget: list
            allow_add: false
            hint: "Reihenfolge nicht ändern — sie bestimmt die Anzeige auf der Seite."
            fields:
              - { name: id, label: Technische ID (nicht ändern!), widget: string, readonly: true }
              - { name: title, label: Titel, widget: string }
              - { name: description, label: Kurzbeschreibung (Startseite), widget: text }
              - { name: detailDescription, label: Lange Beschreibung (Leistungen-Seite), widget: text }
              - { name: icon, label: Icon, widget: select, options: [wrench, leaf, home, truck, recycle] }
              - { name: image, label: Karten-Bild, widget: image, required: false }
              - { name: imageAlt, label: "Bild-Beschreibung (Alt-Text)", widget: string, required: false }
              - { name: detailImage, label: Detail-Bild, widget: image, required: false }
              - name: subPage
                label: "Zusatz-Link (derzeit ausgeblendet — Änderungen hier sind aktuell ohne Wirkung)"
                widget: object
                required: false
                fields:
                  - { name: href, label: Link, widget: string }
                  - { name: label, label: Link-Text, widget: string }

  # ────────────────────────────────────────────────────────────
  - name: seo
    label: SEO / Google
    description: Meta-Titel und Meta-Beschreibungen für Google. Leer lassen = automatischer Standard.
    files:
      - name: meta
        label: Google Titel & Beschreibungen
        file: site/src/data/meta-overrides.json
        fields:
          - name: pages
            label: Einzelne Seiten
            widget: list
            allow_add: false
            fields:
              - { name: path, label: Seite (nicht ändern), widget: string, readonly: true }
              - { name: title, label: "Google-Titel (leer = Standard)", widget: string, required: false, hint: "Empfohlen max. 60 Zeichen. Der Zusatz '| Rund ums Haus Littawe' wird automatisch angehängt (außer Startseite)." }
              - { name: description, label: "Google-Beschreibung (leer = Standard)", widget: text, required: false, hint: "Empfohlen 120–160 Zeichen." }
          - name: services
            label: Dienstleistungs-Seiten (alle 98 Städte je Dienstleistung)
            widget: list
            allow_add: false
            fields:
              - { name: id, label: Dienstleistung (nicht ändern), widget: string, readonly: true }
              - { name: titlePattern, label: "Titel-Muster (leer = Standard)", widget: string, required: false, hint: "Pflicht-Platzhalter {city} = Stadtname. Beispiel: Gartenpflege {city} ★ Ihr Gärtner vor Ort" }
              - { name: descriptionPattern, label: "Beschreibungs-Muster (leer = Standard)", widget: text, required: false, hint: "Auch hier {city} verwenden. Gilt für alle 98 Stadt-Seiten dieser Dienstleistung." }

  # ────────────────────────────────────────────────────────────
  - name: einstellungen
    label: Einstellungen
    description: Kontaktdaten, Navigation, Footer. Vorsicht bei Links.
    files:
      - name: site
        label: Seiten-Einstellungen
        file: site/src/data/site.json
        fields:
          - { name: company, label: Firmenname, widget: string }
          - { name: owner, label: Inhaber, widget: string }
          - name: address
            label: Adresse
            widget: object
            fields:
              - { name: street, label: Straße, widget: string }
              - { name: city, label: Stadt, widget: string }
              - { name: zip, label: PLZ, widget: string }
              - { name: country, label: Land, widget: string }
          - { name: phone, label: Telefon, widget: string }
          - { name: email, label: E-Mail, widget: string }
          - name: navigation
            label: Navigation (Menü)
            widget: list
            fields:
              - { name: label, label: Menü-Text, widget: string }
              - { name: href, label: Link, widget: string, hint: "Nur ändern, wenn die Ziel-Seite existiert!" }
          - name: footer
            label: Footer
            widget: object
            fields:
              - { name: copyright, label: Copyright-Zeile, widget: string }
              - name: legalLinks
                label: Rechtliche Links
                widget: list
                allow_add: false
                fields:
                  - { name: label, label: Text, widget: string }
                  - { name: href, label: Link, widget: string }

  # ────────────────────────────────────────────────────────────
  # PX-069: Stadt-Seiten Texte — Kevin's Wettbewerbsrecht request 2026-06-10.
  # Field schema shared via YAML anchor; validator enforces full coverage.
  - name: stadtseiten
    label: Stadt-Seiten Texte
    description: "Texte der 98 Stadt-Seiten je Dienstleistung (Leistungslisten, Beschreibungen, FAQ). Platzhalter (nur in Text-Feldern, nicht in Listen-Punkten): {city} = Stadtname, {dist} = Entfernungs-Satz, {einsatz} = Einsatzgebiets-Satz, {list} = Nachbarstädte-Liste. Änderungen gelten für alle 98 Städte der Dienstleistung."
    files:
      - name: gartenpflege
        label: Gärtner & Gartenpflege
        file: site/src/data/templates/gartenpflege.json
        fields: &stadtseiten_fields
          - { name: h1, label: "Überschrift (H1)", widget: string, hint: "{city} = Stadtname" }
          - { name: heroImage, label: "Hero-Bild (oben auf den Stadt-Seiten)", widget: image }
          - { name: heroAlt, label: "Bild-Beschreibung (Alt-Text)", widget: string, hint: "{city} = Stadtname" }
          - { name: intro1, label: "Einleitung — Absatz 1", widget: text }
          - { name: intro2, label: "Einleitung — Absatz 2", widget: text, hint: "{dist} = automatischer Entfernungs-Satz" }
          - { name: benefits, label: "✅ Vorteile (oben)", widget: list, field: { name: item, label: Punkt, widget: string } }
          - name: cta
            label: "Kontakt-Block"
            widget: object
            fields:
              - { name: heading, label: Überschrift, widget: string }
              - { name: text, label: Text, widget: text }
          - name: sectionsBefore
            label: "Abschnitte VOR der Leistungsliste"
            widget: list
            fields:
              - { name: heading, label: Überschrift, widget: string }
              - { name: paragraphs, label: Absätze, widget: list, field: { name: p, label: Absatz, widget: text } }
          - name: leistungen
            label: "Leistungsliste"
            widget: object
            fields:
              - { name: heading, label: Überschrift, widget: string }
              - { name: intro, label: Einleitungssatz, widget: string }
              - { name: items, label: Leistungen, widget: list, field: { name: item, label: Leistung, widget: string } }
              - { name: footnote, label: Schlusszeile, widget: string }
          - name: sectionsAfter
            label: "Abschnitte NACH der Leistungsliste"
            widget: list
            fields:
              - { name: heading, label: Überschrift, widget: string }
              - { name: paragraphs, label: Absätze, widget: list, field: { name: p, label: Absatz, widget: text } }
          - name: warum
            label: "Warum wir?"
            widget: object
            fields:
              - { name: heading, label: Überschrift, widget: string }
              - { name: items, label: "✓ Punkte", widget: list, field: { name: item, label: Punkt, widget: string } }
              - { name: cityLine, label: "Letzter Punkt (mit {city})", widget: string }
          - name: einsatzgebiet
            label: "Einsatzgebiet"
            widget: object
            fields:
              - { name: heading, label: Überschrift, widget: string }
              - { name: text, label: Text, widget: text, hint: "{list} = Nachbarstädte, {einsatz} = automatischer Satz" }
          - name: faq
            label: "Häufige Fragen"
            widget: object
            fields:
              - { name: heading, label: Überschrift, widget: string }
              - name: items
                label: Fragen
                widget: list
                fields:
                  - { name: q, label: Frage, widget: string }
                  - { name: a, label: Antwort, widget: text }
                  - { name: cityInQuestion, label: "Stadtname an Frage anhängen?", widget: boolean, default: false }
          - name: weitereLeistungen
            label: "Weitere Leistungen (Links)"
            widget: object
            fields:
              - { name: heading, label: Überschrift, widget: string }
              - name: links
                label: Links
                widget: list
                allow_add: false
                fields:
                  - { name: label, label: Link-Text, widget: string }
                  - { name: servicePath, label: "Technischer Pfad (nicht ändern!)", widget: string, readonly: true }
                  - { name: isHub, label: "Übersichtsseite? (nicht ändern)", widget: boolean, required: false, readonly: true }
          - name: einsatzorte
            label: "Weitere Einsatzorte"
            widget: object
            fields:
              - { name: heading, label: Überschrift, widget: string }
              - { name: chipLabel, label: "Stadt-Link-Text (mit {city})", widget: string }
              - { name: expandLabel, label: "Aufklapp-Text (mit {count})", widget: string }
      - name: hausmeisterservice
        label: Hausmeisterservice
        file: site/src/data/templates/hausmeisterservice.json
        fields: *stadtseiten_fields
      - name: dacharbeiten
        label: Dachservice & Dacharbeiten
        file: site/src/data/templates/dacharbeiten.json
        fields: *stadtseiten_fields
      - name: entruempelung
        label: Entrümpelung
        file: site/src/data/templates/entruempelung.json
        fields: *stadtseiten_fields
      - name: schrottabholung
        label: Schrottabholung
        file: site/src/data/templates/schrottabholung.json
        fields: *stadtseiten_fields

  # ────────────────────────────────────────────────────────────
  # PX-070: full coverage — remaining content files (CEO audit demand).
  - name: inhalte
    label: Weitere Inhalte
    description: Referenzen, Bewertungen, Weitere Dienstleistungen, Einsatzgebiete-Seite, Kontaktformular, Ratgeber-Titel.
    files:
      - name: weitere-leistungen
        label: Weitere Dienstleistungen (Liste)
        file: site/src/data/weitere-leistungen.json
        fields:
          - { name: heading, label: Überschrift, widget: string }
          - { name: subheading, label: Untertitel, widget: text }
          - { name: services, label: Dienstleistungen, widget: list, field: { name: item, label: Dienstleistung, widget: string } }
          - { name: footer, label: Schlusszeile, widget: string }
      - name: referenzen
        label: Referenzen (Vorher/Nachher)
        file: site/src/data/referenzen.json
        fields:
          - { name: heading, label: Überschrift, widget: string }
          - { name: emptyState, label: "Text wenn leer", widget: string }
          - name: items
            label: Referenz-Fälle
            widget: list
            fields:
              - { name: id, label: "Technische ID (eindeutig, klein, Bindestriche)", widget: string }
              - { name: title, label: Titel, widget: string }
              - { name: description, label: Beschreibung, widget: text }
              - { name: before, label: Vorher-Bild, widget: image }
              - { name: after, label: Nachher-Bild, widget: image }
              - { name: date, label: "Datum (JJJJ-MM)", widget: string }
              - name: steps
                label: "Schritte-Galerie (optional)"
                widget: list
                required: false
                fields:
                  - { name: src, label: Bild, widget: image }
                  - { name: label, label: Beschriftung, widget: string }
      - name: reviews
        label: Google-Bewertungen (Slider)
        file: site/src/data/reviews.json
        fields:
          - { name: source, label: "Quelle (nicht ändern)", widget: string, readonly: true }
          - { name: verified, label: "Interne Notiz (wird nicht angezeigt)", widget: string }
          - name: aggregateRating
            label: Gesamt-Bewertung
            widget: object
            fields:
              - { name: ratingValue, label: Durchschnitt, widget: number, value_type: float }
              - { name: ratingCount, label: Anzahl, widget: number, value_type: int }
              - { name: bestRating, label: Beste, widget: number, value_type: int }
              - { name: worstRating, label: Schlechteste, widget: number, value_type: int }
          - name: reviews
            label: Bewertungen
            widget: list
            fields:
              - { name: id, label: "Technische ID (eindeutig)", widget: string }
              - { name: author, label: Name, widget: string }
              - { name: city, label: Stadt, widget: string }
              - { name: rating, label: "Sterne (1-5)", widget: number, value_type: int }
              - { name: datePublished, label: "Datum (JJJJ-MM-TT)", widget: string }
              - { name: text, label: Text, widget: text }
              - { name: service, label: "Leistung (optional)", widget: string, required: false }
      - name: service-areas
        label: Einsatzgebiete-Seite (Regionen)
        file: site/src/data/service-areas.json
        fields:
          - { name: heading, label: Überschrift, widget: string }
          - { name: subheading, label: Untertitel, widget: text }
          - name: regions
            label: Regionen
            widget: list
            fields:
              - { name: name, label: Regions-Name, widget: string }
              - { name: cities, label: Städte, widget: list, field: { name: city, label: Stadt, widget: string }, hint: "Stadtnamen müssen exakt den Stadt-Seiten entsprechen" }
          - { name: footer, label: Schlusszeile, widget: string }
      - name: contact-form
        label: Kontaktformular (Texte)
        file: site/src/data/contact-form.json
        fields:
          - { name: title, label: "Seitentitel (derzeit ungenutzt)", widget: string }
          - { name: heading, label: Überschrift, widget: string }
          - { name: body, label: Einleitung, widget: text }
          - name: sections
            label: Formular-Abschnitte
            widget: list
            fields:
              - { name: heading, label: Abschnitts-Überschrift, widget: string }
              - name: fields
                label: Felder
                widget: list
                fields:
                  - { name: name, label: "Technischer Name (nicht ändern)", widget: string, readonly: true }
                  - { name: label, label: Beschriftung, widget: string }
                  - { name: type, label: "Typ (nicht ändern)", widget: string, readonly: true }
                  - { name: required, label: Pflichtfeld, widget: boolean }
                  - { name: placeholder, label: Platzhalter-Text, widget: string, required: false }
          - { name: submitLabel, label: Absende-Button, widget: string }
          - { name: successMessage, label: Erfolgs-Meldung, widget: text }
          - { name: errorMessage, label: Fehler-Meldung, widget: text }
      - name: ratgeber
        label: Ratgeber (Titel & Google-Texte)
        file: site/src/data/ratgeber.json
        fields:
          - name: articles
            label: Artikel
            widget: list
            allow_add: false
            hint: "Artikel-Inhalte ändert Eduard; hier nur Titel und Google-Texte."
            fields:
              - { name: slug, label: "URL-Teil (nicht ändern!)", widget: string, readonly: true }
              - { name: title, label: Titel, widget: string }
              - { name: metaTitle, label: Google-Titel, widget: string }
              - { name: metaDescription, label: Google-Beschreibung, widget: text }
              - { name: category, label: Kategorie, widget: string }
              - { name: publishedDate, label: "Datum (JJJJ-MM-TT)", widget: string }
              - { name: readingTimeMinutes, label: "Lesezeit (Min.)", widget: number, value_type: int }
              - { name: primaryService, label: "Zugehörige Leistung (nicht ändern)", widget: string, readonly: true }
              - { name: howTo, label: "How-To Schema aktiv", widget: boolean }
              - { name: howToTitle, label: How-To Titel, widget: string, required: false }
              - name: howToSteps
                label: How-To Schritte
                widget: list
                required: false
                fields:
                  - { name: name, label: Schritt-Titel, widget: string }
                  - { name: text, label: Schritt-Text, widget: text }
